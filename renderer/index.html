<!doctype html>
<html><head><meta charset="utf-8"><title>Prism</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval' blob:; worker-src blob:; font-src 'self'">
<style>
:root{--bg:#0b0d12;--s:#12151c;--s2:#171b24;--b:#232836;--t:#e8eaf0;--m:#a3aabb;--a:#8b7bff}
*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-columns:250px 1fr 400px;grid-template-rows:44px 36px 1fr 210px 24px;background:var(--bg);color:var(--t);font:13px 'Segoe UI',system-ui,sans-serif}
button,input,select{background:var(--s2);color:var(--t);border:1px solid var(--b);border-radius:6px;padding:5px 10px;font:inherit}button{cursor:pointer}button:hover{border-color:var(--a)}.pri{background:var(--a);color:#0b0d12;border-color:var(--a);font-weight:600}
#bar{grid-column:1/4;display:flex;gap:8px;align-items:center;padding:0 12px;background:var(--s);border-bottom:1px solid var(--b)}#bar b{margin-right:6px;font-size:15px}
#tree{grid-row:2/5;overflow:auto;padding:8px;background:var(--s);border-right:1px solid var(--b)}#tree div{padding:3px 6px;border-radius:4px;cursor:pointer;white-space:nowrap}#tree div:hover{background:var(--s2)}
#tabs{grid-column:2;grid-row:2;display:flex;overflow-x:auto;background:var(--s);border-bottom:1px solid var(--b)}.tab{padding:9px 14px;cursor:pointer;color:var(--m);border-right:1px solid var(--b);white-space:nowrap}.tab.on{color:var(--t);background:var(--bg);box-shadow:inset 0 2px var(--a)}
#editor{grid-column:2;grid-row:3}#term{grid-column:2;grid-row:4;display:flex;flex-direction:column;border-top:1px solid var(--b);background:var(--s)}
#termout{flex:1;margin:0;padding:8px;overflow:auto;font:12px 'JetBrains Mono',Consolas,monospace}#term input,#chat input{margin:8px}
#chat{grid-column:3;grid-row:3/5;display:flex;flex-direction:column;background:var(--s);border-left:1px solid var(--b)}
#log{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}.msg{white-space:pre-wrap;line-height:1.55}.me{background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:8px 12px;align-self:flex-end;max-width:90%}.tool{font:12px monospace;color:#7aa2f7;background:var(--bg);border-radius:6px;padding:5px 8px}.err{color:#ff6b81}
#status{grid-column:1/4;display:flex;gap:16px;align-items:center;padding:0 12px;background:var(--a);color:#0b0d12;font-size:12px;font-weight:600}
#rev{display:none;position:fixed;inset:6% 8%;z-index:9;background:var(--s);border:1px solid var(--a);border-radius:12px;flex-direction:column;box-shadow:0 20px 80px #000c}#rev.show{display:flex}#rev header{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--b)}#rev header span{flex:1;font-weight:600}#diff{flex:1}
</style></head><body>
<div id="bar"><b>◈ Prism</b><button id="open">Open Folder</button><input id="url" placeholder="git URL to clone" size="30"><button id="clone">Clone</button><button id="save">Save</button><button id="gs">Git status</button><button id="gc">Commit</button><button id="gp">Push</button><button id="re" class="pri">Reverse engineer</button><span style="flex:1"></span><select id="provider"><option value="ollama">Local (Ollama)</option><option value="claude">Claude API</option></select><select id="model"></select><button id="key">API Key</button></div>
<div id="tree"></div><div id="tabs"></div><div id="editor"></div>
<div id="term"><pre id="termout"></pre><input id="cmd" placeholder="$ run a command, Enter"></div>
<div id="chat"><div id="log"></div><input id="prompt" placeholder="Ask Prism to build, fix, explain…"></div>
<div id="status"><span id="st1">No folder open</span><span id="st2"></span></div>
<div id="rev"><header><span id="revt"></span><button id="rej">Reject</button><button id="acc" class="pri">Accept change</button></header><div id="diff"></div></div>
<script src="../node_modules/monaco-editor/min/vs/loader.js"></script><script src="renderer.js"></script>
</body></html>
