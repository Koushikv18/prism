<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Prism</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval' blob:; worker-src blob:; font-src 'self'">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="../node_modules/monaco-editor/min/vs/editor/editor.main.css">
</head><body>
<header id="top">
  <div class="brand"><span class="logo">◈</span> Prism</div>
  <div class="actions">
    <button id="open" class="btn">Open Folder</button>
    <input id="url" placeholder="Clone: https://github.com/user/repo.git">
    <button id="clone" class="btn">Clone</button>
  </div>
  <div class="spacer"></div>
  <select id="provider"><option value="ollama">Local · Ollama</option><option value="gemini">Gemini API</option><option value="claude">Claude API</option></select>
  <select id="model"></select>
  <button id="key" class="btn ghost" title="Set Anthropic API key">API Key</button>
</header>
<main id="shell">
  <nav id="activity">
    <button class="act on" data-view="files" title="Explorer">🗂</button>
    <button class="act" data-view="search" title="Quick Open (Ctrl+P)">🔍</button>
    <div class="spacer"></div>
    <button class="act" id="togChat" title="Toggle AI panel (Ctrl+L)">✦</button>
  </nav>
  <aside id="side"><div class="pane-title" id="rootName">EXPLORER</div><div id="tree"></div></aside>
  <div class="split v" id="s1"></div>
  <section id="center">
    <div id="tabs"></div>
    <div id="crumbs"></div>
    <div id="editorWrap"><div id="editor"></div>
      <div id="welcome"><div class="logo big">◈</div><h1>Prism</h1><p>AI-native code editor</p>
        <ul><li><kbd>Ctrl</kbd>+<kbd>P</kbd> Quick open</li><li><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> Commands</li><li><kbd>Ctrl</kbd>+<kbd>S</kbd> Save</li><li><kbd>Ctrl</kbd>+<kbd>`</kbd> Terminal</li><li><kbd>Ctrl</kbd>+<kbd>L</kbd> AI panel</li></ul></div></div>
    <div class="split h" id="s2"></div>
    <div id="panel"><div class="pane-title">TERMINAL</div><pre id="termout"></pre>
      <div class="prompt-row"><span id="ps">$</span><input id="cmd" spellcheck="false" placeholder="run a command…"></div></div>
  </section>
  <div class="split v" id="s3"></div>
  <aside id="chat"><div class="pane-title">✦ PRISM AGENT</div><div id="log"></div>
    <div class="composer"><textarea id="prompt" rows="2" placeholder="Ask Prism to build, fix, explain…  (Enter to send)"></textarea></div></aside>
</main>
<footer id="status"><span id="branch">⎇ —</span><span id="fileinfo"></span><div class="spacer"></div><span id="lang"></span><span id="pos">Ln 1, Col 1</span><span id="prov"></span></footer>
<div id="palette" hidden><input id="pin" spellcheck="false"><ul id="plist"></ul></div>
<script src="../node_modules/monaco-editor/min/vs/loader.js"></script>
<script src="renderer.js"></script>
</body></html>
